openapi: "3.0.3"
info:
  title: SETOLIA API
  version: "1.0"
servers:
  - url: http://127.0.0.1:{port}
    description: |
      The port can be changed in the SETOLIA dock ("Server Port"). Clients that call the API directly
      (e.g. Stream Deck calling /next) must use the same port.
    variables:
      port:
        default: "8080"
components:
  schemas:
    data:
      type: object
      properties:
        reserve:
          type: array
          items:
            type: string
        singing:
          type: array
          items:
            type: string
            description: If timestamps available, length becomes 2.
            minLength: 1
            maxLength: 2
        setlist:
          type: array
          items:
            type: array
            items:
              type: string
              description: If timestamps available, length becomes 2.
              minLength: 1
              maxLength: 2
paths:
  /data:
    description: Get current data
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/data"
  /events:
    get:
      description: |
        Endpoint for Server-Sent Events (SSE). Sends the current data on connect and on every change.
        When nothing changed for 15 seconds a comment line (": ping") is sent to detect closed clients.
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/data"
  /next:
    post:
      description: |
        Switch to the next song.

        Origin restriction (dock option "Reject next-song requests from browsers (web pages)", stored as
        restrictNextOrigin in setolia-config.json, default off):
          - Off (default): every request is accepted and the response has "Access-Control-Allow-Origin: *".
          - On: the request is accepted only if it has no Origin header (curl, most Stream Deck plugins) or
            its Origin is http://127.0.0.1:<port> or http://localhost:<port>. Other requests get 403.
            "Access-Control-Allow-Origin" is not sent.
        Requests with an Origin header are logged once per origin and OBS session in either mode.
      parameters:
        - name: Origin
          in: header
          required: false
          schema:
            type: string
          example: http://127.0.0.1:8080
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
        "403":
          description: Rejected by the origin restriction (only when the restriction is enabled)
          content:
            text/plain:
              schema:
                type: string
                example: Forbidden
        "413":
          description: Request body larger than 1024 bytes
  /templates/{path}:
    get:
      description: |
        Serve files from the template folders. Two folders are mounted on /templates and searched in this
        order, file by file:
          1. The user template folder (obs_module_config_path("templates"), e.g.
             %APPDATA%\obs-studio\plugin_config\setolia\templates). Custom templates go here; it is kept
             when the plugin is uninstalled or updated.
          2. The bundled template folder (obs_module_file("templates")).
        A user template with the same name as a bundled template therefore takes precedence.
        Browser sources added by SETOLIA load http://127.0.0.1:<port>/templates/<template name>/index.html.
        Template names are percent-encoded. Responses include "Cache-Control: no-cache"
        so edits to template files are reflected on the next reload.
      parameters:
        - name: path
          in: path
          required: true
          description: Path relative to the template folders, e.g. light/index.html
          schema:
            type: string
          example: light/index.html
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
          content:
            text/html: {}
            text/css: {}
            text/javascript: {}
        "404":
          description: Not Found
