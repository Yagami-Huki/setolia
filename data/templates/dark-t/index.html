<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SETOLIA</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@600&family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <section class="glass-card now-singing-section">
            <h1>Now Singing</h1>
            <hr />
            <div class="now-singing-content">
                <p id="now-singing"></p>
            </div>
        </section>

        <div class="glass-card lists-container">
            <section class="list-column setlist-section">
                <h2>Set List</h2>
                <hr />
                <ul id="set-list">
                </ul>
            </section>

            <div class="vertical-divider"></div>

            <section class="list-column reserve-section">
                <h2>Reserve</h2>
                <hr />
                <ul id="reserve-list">
                </ul>
            </section>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
